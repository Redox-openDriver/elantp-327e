[package]
name = "elantp-redox"
version = "0.1.0"
description = "Тачпад ELAN 04F3:327E в Redox OS: контроллер I2C DesignWare, выводы GPIO AMD, HID over I2C, события в inputd"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Redox-openDriver/elantp-327e"
publish = false

[workspace]

[dependencies]
elantp-core = { path = "../core" }
gestus = { path = "../gestus", features = ["config"] }
drv-i18n = { git = "https://github.com/Redox-openDriver/drv-i18n", tag = "v0.1.0" }
libredox = "0.2"
redox_event = "0.5"
redox_syscall = { version = "0.9.5", features = ["std"] }
common = { git = "https://gitlab.redox-os.org/redox-os/base.git", rev = "8f576d27ee5d028157b001e320affc7b1ec2736b" }
inputd = { git = "https://gitlab.redox-os.org/redox-os/base.git", rev = "8f576d27ee5d028157b001e320affc7b1ec2736b" }
orbclient = { git = "https://gitlab.redox-os.org/redox-os/orbclient.git" }

[[bin]]
name = "elantpd"
path = "src/bin/elantpd.rs"
