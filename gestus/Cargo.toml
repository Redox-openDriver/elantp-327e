[package]
name = "gestus"
version = "0.1.0"
description = "Жесты тачпада без привязки к устройству и ОС: указатель, тапы, прокрутка с инерцией, свайпы, углы, рейки, символы и многое другое; каждая функция включается в настройках"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
config = ["dep:serde", "dep:toml"]

[dependencies]
libm = "0.2"
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
toml = { version = "1", optional = true }
