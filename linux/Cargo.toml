[package]
name = "elantp-linux"
version = "0.1.0"
description = "Тачпад ELAN 04F3:327E на Linux: поиск устройства, запись и разбор касаний для разработки"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
