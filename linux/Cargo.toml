[package]
name = "elantp-linux"
version = "0.4.0"
description = "Тачпад ELAN 04F3:327E на Linux: поиск устройства, запись и разбор касаний для разработки"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
elantp-core = { path = "../core" }
drv-i18n = { git = "https://github.com/Redox-openDriver/drv-i18n", tag = "v0.1.1" }
libc = "0.2"
gestus = { git = "https://github.com/Redox-openDriver/gestus", tag = "v0.3.0", features = ["config"] }

[[bin]]
name = "elantp-dev"
path = "src/bin/elantp-dev.rs"

[[bin]]
name = "elantpd"
path = "src/bin/elantpd.rs"
